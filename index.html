    <!--
      Applies saved settings before first paint (no theme flash).
      Mirrors applyToDocument() in src/store/settings.ts: keep the ACCENTS values in sync.
    -->
    <script>
      (function () {
        try {
          var A = {
            orange: { paper: '#B4441A', blueprint: '#F08A4B' },
            ink: { paper: '#24509E', blueprint: '#8FB3F2' },
            green: { paper: '#2E6B3E', blueprint: '#7FC99A' },
            teal: { paper: '#0E6A6A', blueprint: '#6FD0CC' },
            ochre: { paper: '#8A5A00', blueprint: '#E7B451' }
          };
          var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
          var s = { theme: 'paper', accent: 'orange', motion: !reduced, density: 1 };
          var saved = {};
          try {
            saved = JSON.parse(localStorage.getItem('nf-settings') || '{}') || {};
          } catch (e) {}
          for (var k in saved) if (Object.prototype.hasOwnProperty.call(saved, k)) s[k] = saved[k];
          if (s.theme !== 'blueprint') s.theme = 'paper';
          if (!A[s.accent]) s.accent = 'orange';
          var r = document.documentElement;
          r.setAttribute('data-theme', s.theme);
          r.setAttribute('data-motion', s.motion ? 'on' : 'off');
          r.setAttribute('data-density', String(s.density));
          r.style.setProperty('--accent', A[s.accent][s.theme]);
          r.style.colorScheme = s.theme === 'blueprint' ? 'dark' : 'light';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', s.theme === 'blueprint' ? '#0f2233' : '#f4efe6');
        } catch (e) {}
      })();
    </script>
